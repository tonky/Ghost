name: 'enve Fast CI & Rootless PR Gatekeeper (Ghost PoC)'

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  push:
    branches:
      - main
      - 'feat/**'

env:
  CLOUDFLARE_BUCKET: 'https://847959617b8d3ada9eb84238a37f56ec.r2.cloudflarestorage.com/gleam-enve-cache'
  AWS_ENDPOINT_URL: 'https://847959617b8d3ada9eb84238a37f56ec.r2.cloudflarestorage.com'
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ENVE_CACHE_PUBLIC_KEY: 'gleam-cache-1:na3b/m8oWFE71SvB09Cer/eDBCQWDyKGBwKkYD9NquY='
  FORCE_COLOR: 1
  DISABLE_V8_COMPILE_CACHE: 1
  NX_NATIVE_COMMAND_RUNNER: 'false'

jobs:
  fast-pr-gatekeeper:
    name: 'Fast PR Gatekeeper (Formatting, Standards, Unit & Database Smoke Tests)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Initialize Nix Store Directory
        shell: bash
        run: |
          sudo mkdir -p /nix/store
          sudo chown -R $(whoami) /nix

      - name: Restore Nix Store Closures (L1 Cache)
        uses: actions/cache/restore@v6
        id: nix-store-cache
        with:
          path: /nix/store
          key: nix-store-ghost-${{ runner.os }}-${{ hashFiles('enve.lock') }}
          restore-keys: |
            nix-store-ghost-${{ runner.os }}-
            nix-store-${{ runner.os }}-

      - name: Install hermetic enve binary from private cache
        shell: bash
        run: |
          scripts/fetch_enve.sh /usr/local/bin/enve
          enve --version

      - name: Verify enve CUE environment schema
        shell: bash
        run: |
          enve check enve.cue

      - name: Synchronize Pre-built Closures (L1 / L2 Zero-Egress R2)
        shell: bash
        run: |
          enve cache pull enve.lock -j 4 --cache "${CLOUDFLARE_BUCKET}" --trusted-public-key "${ENVE_CACHE_PUBLIC_KEY}" || true

      - name: Save Nix Store Closures to L1 Cache Immediately (Early Population)
        uses: actions/cache/save@v6
        if: steps.nix-store-cache.outputs.cache-hit != 'true'
        with:
          path: /nix/store
          key: ${{ steps.nix-store-cache.outputs.cache-primary-key || format('nix-store-ghost-{0}-{1}', runner.os, hashFiles('enve.lock')) }}

      - name: Restore pnpm package cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Hydrate Monorepo Workspace Dependencies
        shell: bash
        run: |
          enve run -- pnpm install --frozen-lockfile

      - name: Real-Time Supply Chain Vulnerability Audit (enve shield)
        shell: bash
        run: |
          enve audit enve.cue || true

      - name: Check Code Formatting (oxfmt)
        shell: bash
        run: |
          enve run -- just fmt-check

      - name: Internal Package Standards Verification
        shell: bash
        run: |
          enve run -- just lint-pkgs

      - name: Ghost Core Unit Test Suite (8,547 Vitest Tests)
        shell: bash
        run: |
          enve run -- just test-unit

      - name: Rootless MySQL Database Integration & Migrations Smoke Test
        shell: bash
        run: |
          enve run -- just test-integration
